name: Full Valorant model backtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-valorant-backtest
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Export the live D1 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 export lol-stats-db --remote --output /tmp/valorant-backtest.sql
      - name: Replay all eligible Valorant maps and series
        run: python scripts/backtest-valorant.py /tmp/valorant-backtest.sql
      - name: Publish result in the log
        run: cat /tmp/valorant-backtest.sql.valorant-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-valorant-backtest-result
          path: /tmp/valorant-backtest.sql.valorant-result.json
          if-no-files-found: error
