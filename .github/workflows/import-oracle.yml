name: Sync Oracle's Elixir data

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year. Leave blank to use the current Europe/Tirane year."
        required: false
        type: string
      max_games:
        description: "Safety limit for a test or phased import. Enter 2 for a test, 1500 for a backfill chunk, or leave blank for all changed games."
        required: false
        type: string
  schedule:
    # GitHub Actions uses UTC. One of these is 00:01 in Europe/Tirane across DST changes.
    - cron: "1 22 * * *"
    - cron: "1 23 * * *"

permissions:
  contents: read

concurrency:
  group: oracle-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import from Oracle's public Drive folder
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_YEAR: ${{ inputs.year }}
          ORACLE_MAX_GAMES: ${{ inputs.max_games }}
          ORACLE_IMPORT_URL: ${{ secrets.ORACLE_IMPORT_URL }}
          ORACLE_IMPORT_TOKEN: ${{ secrets.ORACLE_IMPORT_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if ! node scripts/is-tirane-midnight.mjs; then
              echo "Not the Europe/Tirane midnight run; nothing to do."
              exit 0
            fi
            YEAR="$(node scripts/next-oracle-import-year.mjs)"
            SOURCE_URL="$(node scripts/resolve-oracle-drive-file.mjs "$YEAR")"
            ORACLE_MAX_GAMES="${ORACLE_MAX_GAMES:-1500}"
          else
            YEAR="$INPUT_YEAR"
            if [[ -z "$YEAR" ]]; then YEAR="$(node scripts/current-oracle-year.mjs)"; fi
            SOURCE_URL="$(node scripts/resolve-oracle-drive-file.mjs "$YEAR")"
          fi
          MIRROR_OBJECT="${YEAR}_LoL_esports_match_data_from_OraclesElixir.csv"
          MIRROR_URL="https://pub-b6eea12acc9142678d1e15941794c319.r2.dev/${MIRROR_OBJECT}"
          MIRROR_FILE="$RUNNER_TEMP/$MIRROR_OBJECT"

          echo "Syncing Oracle's Elixir season $YEAR (limit: ${ORACLE_MAX_GAMES:-all} changed games)"
          if node scripts/download-oracle-csv.mjs "$YEAR" "$SOURCE_URL" "$MIRROR_FILE"; then
            if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET_NAME" ]]; then
              echo "R2 credentials are not configured yet; importing this verified Oracle download directly."
              node scripts/import-oracle.mjs "$YEAR" "$SOURCE_URL"
            else
              if ! command -v aws >/dev/null 2>&1; then
                python3 -m pip install --user awscli
                export PATH="$HOME/.local/bin:$PATH"
              fi
              AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION="auto" \
                aws s3 cp "$MIRROR_FILE" "s3://$R2_BUCKET_NAME/$MIRROR_OBJECT" --endpoint-url "$R2_ENDPOINT"
              echo "R2 mirror updated: $MIRROR_URL"
              node scripts/import-oracle.mjs "$YEAR" "$MIRROR_URL"
            fi
          else
            echo "Oracle's download is unavailable; importing from the existing R2 mirror."
            node scripts/import-oracle.mjs "$YEAR" "$MIRROR_URL"
          fi
